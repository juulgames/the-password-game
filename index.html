<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Password Game - School Editie</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .game-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 90%; max-width: 600px; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 2.5rem; }
        .streak { font-size: 1.4rem; color: #7f8c8d; margin-bottom: 10px; }
        .timer { font-size: 2.5rem; font-weight: bold; color: #e74c3c; margin: 20px 0; }
        .hint-box { background: #fdfdfd; border: 2px dashed #3498db; padding: 25px; border-radius: 12px; min-height: 100px; display: flex; align-items: center; justify-content: center; font-style: italic; font-size: 1.2rem; margin-bottom: 25px; color: #34495e; }
        input { width: 100%; padding: 15px; font-size: 1.4rem; border: 3px solid #dfe6e9; border-radius: 10px; box-sizing: border-box; outline: none; transition: all 0.3s; text-align: center; }
        input:focus { border-color: #3498db; box-shadow: 0 0 10px rgba(52,152,219,0.2); }
        .feedback { margin-top: 25px; font-weight: bold; font-size: 1.1rem; min-height: 30px; }
        .success { color: #27ae60; }
        .error { color: #c0392b; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Password Game</h1>
    <div class="streak" id="streak">Streak: 0/3</div>
    <div class="timer" id="timer">20</div>
    <div class="hint-box" id="hint">Laden...</div>
    <input type="text" id="gokInput" placeholder="Antwoord..." autocomplete="off">
    <div class="feedback" id="feedback"></div>
</div>

<script>
    const woordenLijst = [
        {woord: "piano", fouten: ["pianos", "toetsenbord","toetsen"], tip: "Wat heeft sleutels maar geen deuren?"},
        {woord: "handdoek", fouten: ["handdoeken", "handoek"], tip: "Wat wordt natter hoe meer het droogt?"},
        {woord: "gat", fouten: ["gaatje", "kuil"], tip: "Hoe meer je ervan afhaalt, hoe groter het wordt."},
        {woord: "fles", fouten: ["flessen"], tip: "Wat heeft een hals maar geen hoofd?"},
        {woord: "water", fouten: ["de regen"], tip: "Wat loopt zonder benen?"},
        {woord: "kam", fouten: ["kammetje"], tip: "Wat heeft tanden maar kan niet eten?"},
        {woord: "licht", fouten: ["de zon", "stralen"], tip: "Wat kan door glas gaan zonder het te breken?"},
        {woord: "naald", fouten: ["naaldje"], tip: "Wat heeft één oog maar kan niet zien?"},
        {woord: "klok", fouten: ["horloge"], tip: "Wat heeft handen maar kan niet klappen?"},
        {woord: "leeftijd", fouten: ["jaar", "jaren"], tip: "Wat stijgt maar daalt nooit?"},
        {woord: "belofte", fouten: ["beloftes"], tip: "Wat kun je breken zonder het aan te raken?"},
        {woord: "trap", fouten: ["trappen"], tip: "Wat gaat omhoog en omlaag zonder te bewegen?"},
        {woord: "toekomst", fouten: ["morgen", "later"], tip: "Wat is altijd voor je, maar kun je nooit zien?"},
        {woord: "9", fouten: ["negen", "het cijfer 9"], tip: "Wat wordt groter als je het omdraait? (Cijfer)"},
        {woord: "kaart", fouten: ["landkaart", "atlas"], tip: "Wat heeft steden maar geen huizen, rivieren maar geen water?"},
        {woord: "gesprek", fouten: ["praatje"], tip: "Wat kun je vasthouden zonder het ooit aan te raken?"},
        {woord: "tafel", fouten: ["tafeltje"], tip: "Wat heeft vier poten maar kan niet lopen?"},
        {woord: "rivier", fouten: ["de rivier"], tip: "Wat heeft een bed maar slaapt nooit?"},
        {woord: "mais", fouten: ["maïs", "corn"], tip: "Wat heeft oren maar hoort niets?"},
        {woord: "tijd", fouten: ["de tijd"], tip: "Wat vliegt zonder vleugels?"},
        {woord: "spons", fouten: ["sponsje"], tip: "Wat zit vol gaten maar houdt toch water vast?"},
        {woord: "boek", fouten: ["boeken"], tip: "Wat heeft woorden maar spreekt nooit?"},
        {woord: "postzegel", fouten: ["zegel"], tip: "Wat gaat rond de wereld maar blijft in een hoek?"},
        {woord: "ei", fouten: ["eieren"], tip: "Wat kun je niet gebruiken voordat je het hebt gebroken?"},
        {woord: "alle", fouten: ["alle maanden", "iedere"], tip: "Welke maand heeft 28 dagen?"},
        {woord: "houtskool", fouten: ["kool"], tip: "Zwart bij aankoop, rood bij gebruik, grijs bij weggooien?"},
        {woord: "munt", fouten: ["muntje", "geld"], tip: "Wat heeft een staart en een kop maar geen lichaam?"},
        {woord: "geluid", fouten: ["lawaai"], tip: "Wat kun je horen maar niet zien of aanraken?"},
        {woord: "naam", fouten: ["je naam"], tip: "Wat is van jou maar wordt vaker door anderen gebruikt?"},
        {woord: "pinguin", fouten: ["pinguïn", "penguin"], tip: "Wat heeft vleugels maar kan niet vliegen?"},
        {woord: "telefoon", fouten: ["gsm", "mobiel"], tip: "Wat heeft een ring maar geen vinger?"},
        {woord: "regen", fouten: ["de regen"], tip: "Wat valt maar doet zich geen pijn?"},
        {woord: "verkoudheid", fouten: ["griep"], tip: "Wat kun je vangen maar niet gooien?"},
        {woord: "adem", fouten: ["je adem"], tip: "Licht als een veertje, maar zelfs de sterkste man kan het niet lang vasthouden?"},
        {woord: "schoen", fouten: ["schoenen"], tip: "Wat heeft een tong maar praat niet?"},
        {woord: "droom", fouten: ["dromen"], tip: "Wat kun je zien met gesloten ogen?"},
        {woord: "artisjok", fouten: ["groente"], tip: "Wat heeft een hart dat niet klopt?"},
        {woord: "stoel", fouten: ["zetel"], tip: "Wat heeft armen maar kan niets optillen?"},
        {woord: "gedachten", fouten: ["denken", "gedachte"], tip: "Wat is sneller dan de wind?"},
        {woord: "m", fouten: ["de m", "letter m"], tip: "Eén keer in een minuut, twee keer in een moment, nooit in 1000 jaar?"},
        {woord: "stok", fouten: ["tak"], tip: "Wat heeft een begin, een einde, maar geen midden?"},
        {woord: "kaars", fouten: ["kaarsje"], tip: "Wat wordt kleiner als het ouder/groter wordt?"},
        {woord: "echo", fouten: ["eko"], tip: "Wat kan niet praten maar antwoordt altijd?"},
        {woord: "stilte", fouten: ["stilt"], tip: "Wat verdwijnt zodra je zijn naam zegt?"}
    ];

    let streak = 0;
    let tijdOver = 20;
    let huidigItem = null;
    let timerInterval = null;
    let beschikbareVragen = [...woordenLijst];

    const hintEl = document.getElementById('hint');
    const timerEl = document.getElementById('timer');
    const streakEl = document.getElementById('streak');
    const inputEl = document.getElementById('gokInput');
    const feedbackEl = document.getElementById('feedback');

    function nieuwWoord() {
        if (beschikbareVragen.length === 0) beschikbareVragen = [...woordenLijst];
        const index = Math.floor(Math.random() * beschikbareVragen.length);
        huidigItem = beschikbareVragen[index];
        beschikbareVragen.splice(index, 1);
        
        hintEl.innerText = huidigItem.tip;
        tijdOver = 20;
        timerEl.innerText = tijdOver;
        inputEl.value = "";
        feedbackEl.innerText = "";
        inputEl.focus();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            tijdOver--;
            timerEl.innerText = tijdOver;
            if (tijdOver <= 0) verwerkFout("TIJD OM!");
        }, 1000);
    }

    function verwerkGoed() {
        streak++;
        streakEl.innerText = `Streak: ${streak}/3`;
        feedbackEl.innerText = "GOED!";
        feedbackEl.className = "feedback success";
        clearInterval(timerInterval);
        setTimeout(nieuwWoord, 1000);
    }

    function verwerkFout(invoer) {
        streak = 0;
        streakEl.innerText = `Streak: 0/3`;
        feedbackEl.innerText = `FOUT! Het was: ${huidigItem.woord}`;
        feedbackEl.className = "feedback error";
        clearInterval(timerInterval);
        setTimeout(nieuwWoord, 2500);
    }

    inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const gok = inputEl.value.toLowerCase().trim();
            if (gok === huidigItem.woord || huidigItem.fouten.includes(gok)) {
                verwerkGoed();
            } else {
                verwerkFout(inputEl.value);
            }
        }
    });

    nieuwWoord();
</script>
</body>
</html>
